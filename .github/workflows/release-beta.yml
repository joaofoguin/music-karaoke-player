name: Build and Release StageBox Beta

on:
  push:
    tags:
      - "v*-beta"

permissions:
  contents: write

jobs:
  build-release:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Run tests
        run: |
          pytest -q

      - name: Prepare release version
        env:
          STAGEBOX_VERSION: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $version = $env:STAGEBOX_VERSION -replace "^v", ""
          $content = Get-Content "app\core\version.py" -Raw
          $content = $content -replace "APP_VERSION = .*", ("APP_VERSION = """ + $version + """")
          Set-Content "app\core\version.py" -Value $content -Encoding utf8
          Write-Host "StageBox version: $version"
          Get-Content "app\core\version.py"

      - name: Build executable
        env:
          STAGEBOX_LAST_UPDATE: ${{ github.event.head_commit.timestamp }}
        run: |
          pyinstaller --clean --noconfirm stagebox.spec

      - name: Verify executable
        run: |
          if (!(Test-Path "dist\StageBox-Beta.exe")) {
              Write-Error "StageBox-Beta.exe não foi gerado."
              exit 1
          }

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress -y

      - name: Build installer
        env:
          STAGEBOX_VERSION: ${{ github.ref_name }}
        run: |
          $version = $env:STAGEBOX_VERSION -replace "^v", ""
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" "installer\StageBox-Beta.iss"

      - name: Verify installer
        run: |
          if (!(Test-Path "installer\output\StageBox-Beta-Setup.exe")) {
              Write-Error "StageBox-Beta-Setup.exe não foi gerado."
              exit 1
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: true
          files: |
            installer/output/StageBox-Beta-Setup.exe
            dist/StageBox-Beta.exe
